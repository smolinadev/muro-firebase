<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colombia Noviolenta</title>
<style>
  :root{ --paper:#FBF8F1; --ink:#1F1F22; --blue:#196AAC; --yellow:#F1C117; --red:#DF233B; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);
    font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
    display:grid;place-items:center;text-align:center;padding:24px}
  .bars{display:flex;gap:6px;margin-bottom:26px;justify-content:center}
  .bars i{display:block;width:34px;height:8px;border-radius:99px;animation:pulse 1.1s ease-in-out infinite}
  .bars i:nth-child(1){background:var(--yellow)}
  .bars i:nth-child(2){background:var(--blue);animation-delay:.15s}
  .bars i:nth-child(3){background:var(--red);animation-delay:.3s}
  @keyframes pulse{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
  @media (prefers-reduced-motion:reduce){.bars i{animation:none;opacity:1}}
  h1{font-size:19px;font-weight:600;letter-spacing:.02em}
  p{margin-top:8px;font-size:14px;color:#5F5F63}
  a{display:inline-block;margin-top:22px;font-size:15px;font-weight:600;color:var(--blue)}
</style>
</head>
<body>
  <main>
    <div class="bars" aria-hidden="true"><i></i><i></i><i></i></div>
    <h1>Colombia Noviolenta</h1>
    <p id="msg">Abriendo…</p>
    <a id="manual" href="https://forms.cloud.microsoft/r/sxJPka4bF5" hidden>Continuar</a>
  </main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

/* Si Firestore no responde, la gente igual llega al registro. */
const RESPALDO = "https://forms.cloud.microsoft/r/sxJPka4bF5";

const firebaseConfig = {
  apiKey: "AIzaSyBfHjVn6dQxjjOybX2x4W8xJNnGGcapBMM",
  authDomain: "muro-cnv.firebaseapp.com",
  projectId: "muro-cnv",
  storageBucket: "muro-cnv.firebasestorage.app",
  messagingSenderId: "758749379133",
  appId: "1:758749379133:web:0b513294f4aecd2234c854"
};

const msg = document.getElementById("msg");
const manual = document.getElementById("manual");

function llevar(destino){
  if(!/^https:\/\//i.test(destino)) destino = RESPALDO;
  manual.href = destino;
  // replace() y no href: así el botón "atrás" no devuelve a esta página
  location.replace(destino);
  // por si el navegador bloquea la redirección automática
  setTimeout(()=>{ msg.textContent = "Toca el botón para continuar."; manual.hidden = false; }, 2500);
}

try{
  const db = getFirestore(initializeApp(firebaseConfig));
  const snap = await getDoc(doc(db, "config", "qr"));
  llevar(snap.exists() ? (snap.data().destino || RESPALDO) : RESPALDO);
}catch(e){
  llevar(RESPALDO);
}
</script>
</body>
</html>
